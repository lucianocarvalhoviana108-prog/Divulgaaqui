      + (e.message || 'desconhecido')
      + (e.filename ? ('\n\nArquivo: ' + e.filename + ':' + e.lineno + ':' + e.colno) : '')

  });

<style>
  body { background: #FBF8F3; color: #1C1B19; font-family: "Inter", system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
  .font-display { font-family: "Fraunces", serif; letter-spacing: -0.01em; }
  .card { background: #FFFFFF; border: 1px solid #EFE9DC; border-radius: 16px; box-shadow: 0 1px 2px rgba(28,27,25,0.04); }
  .chip { border: 1px solid #E7DFD1; border-radius: 999px; background: #FFFFFF; transition: background .15s ease, color .15s ease, border-color .15s ease; }
  .chip.active { background: #163B35; color: #F3F7F5; border-color: #163B35; }
  .btn-primary { background: #163B35; color: #F3F7F5; border-radius: 12px; font-weight: 600; transition: background .15s ease; }
  .btn-primary:active { background: #0E2A25; }
  .btn-accent { background: #D6425A; color: #fff; border-radius: 12px; font-weight: 600; transition: filter .15s ease; }
  .btn-accent:active { filter: brightness(0.94); }
  .btn-ghost { background: #FFFFFF; color: #1C1B19; border: 1px solid #E7DFD1; border-radius: 12px; font-weight: 600; }
  .input { background: #FFFFFF; border: 1px solid #E7DFD1; border-radius: 12px; }
  .scrollx { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 4px; }
  .scrollx::-webkit-scrollbar { display: none; }
  button, a { -webkit-tap-highlight-color: transparent; }
  button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid #163B35; outline-offset: 2px; }
  @keyframes pulse-skel { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo } = React;

// =========================================================
// SUPABASE — já configurado com o projeto real do DivulgaAqui
// =========================================================
const SUPABASE_URL = "https://fqbpthkbaakirzuubngc.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_vJevCQApssTYj0Cn2ULoEA_stqXM39m";
const db = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
const CITY_SLUG = "sao-pedro-do-piaui";

function slugify(text) {
  return text.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
}

// =========================================================
// ÍCONES (SVG inline, sem dependência externa)
// =========================================================
const ICON_PATHS = {
  search: "M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16Zm10 2-4.35-4.35",
  star: "M12 3.5l2.6 5.4 5.9.8-4.3 4.2 1 5.9L12 17l-5.2 2.8 1-5.9-4.3-4.2 5.9-.8L12 3.5Z",
  heart: "M20.8 8.6c0 4.5-6.4 8.7-8.8 10.4-2.4-1.7-8.8-5.9-8.8-10.4a5 5 0 0 1 9-3 5 5 0 0 1 8.6 3Z",
  check: "M20 7 10.5 17 4 10.5",
  pin: "M12 21s-7-6.2-7-11.4A7 7 0 0 1 19 9.6C19 14.8 12 21 12 21Zm0-8.4a2.8 2.8 0 1 0 0-5.6 2.8 2.8 0 0 0 0 5.6Z",
  chevronLeft: "M15 18l-6-6 6-6",
  message: "M21 12a8 8 0 0 1-8 8 8.3 8.3 0 0 1-3.6-.8L3 20l1-4.9A8 8 0 1 1 21 12Z",
  phone: "M6.6 10.8a15 15 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11 11 0 0 0 3.4.55 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1 11 11 0 0 0 .55 3.4 1 1 0 0 1-.25 1L6.6 10.8Z",
  compass: "M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18Zm3.5-12.5-2 5.5-5.5 2 2-5.5 5.5-2Z",
  home: "M4 11.5 12 4l8 7.5V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1v-8.5Z",
  flame: "M12 22a6.5 6.5 0 0 0 6.5-6.5c0-3.5-2.5-4.8-3.3-7.9-.3 1.3-1 2-1.9 1.5-1.1-.6-1.3-2.6-.6-4.6C9.6 6 6 8.7 6 13.5A6.5 6.5 0 0 0 12 22Z",
  calendar: "M7 3v3M17 3v3M4 9h16M5 6h14a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1Z",
  user: "M12 12.5a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9Zm-7.5 8a7.5 7.5 0 0 1 15 0",
  plus: "M12 5v14M5 12h14",
  share: "M18 8.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5Zm0 12a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5ZM6 12a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5Zm2.2-1.4 7.6-3.7M8.2 13.4l7.6 3.7",
  map: "M9 4 4 6.5v13.5L9 17l6 3 5-2.5V4L15 6.5 9 4Zm0 0v13m6-10.5V17",
  clock: "M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18Zm0-13.5V12l3.5 2"
};
function Icon({ name, size = 18, className = "", strokeWidth = 1.9, filled = false }) {
  const d = ICON_PATHS[name];
  if (!d) return null;
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill={filled ? "currentColor" : "none"}
      stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round"
      className={className} aria-hidden="true">
      <path d={d} />
    </svg>
  );
}

// =========================================================
// PEQUENOS COMPONENTES
// =========================================================
function Stars({ value }) {
  return (
    <span className="inline-flex items-center gap-1">
      <Icon name="star" size={13} filled className="text-gold" />
      <span className="text-xs font-semibold">{Number(value ?? 0).toFixed(1)}</span>
    </span>
  );
}

function BusinessCard({ biz, category, fav, onOpen, onToggleFav }) {
  return (
    <button onClick={() => onOpen(biz.id)} className="card w-full flex gap-3 p-3 text-left">
      <div className="flex items-center justify-center text-2xl rounded-2xl flex-shrink-0" style={{ background: "#EDE7DA", width: 64, height: 64 }}>
        {category?.emoji || "🏪"}
      </div>
      <div className="flex-1 min-w-0">
        <div className="flex items-start justify-between gap-2">
          <p className="text-sm font-semibold truncate flex items-center gap-1">
            {biz.name}
            {biz.verified && <Icon name="check" size={13} strokeWidth={2.5} className="text-primary flex-shrink-0" title="Verificada" />}
          </p>
          <span onClick={(e) => { e.stopPropagation(); onToggleFav(biz.id); }} className={fav ? "text-accent" : "text-inksoft"}>
            <Icon name="heart" size={17} filled={fav} />
          </span>
        </div>
        <p className="text-xs text-inksoft mt-0.5">{category?.name || "Empresa"} · {biz.neighborhood}</p>
        <div className="mt-1"><Stars value={biz.rating || 5} /></div>
      </div>
    </button>
  );
}

function OfferCard({ offer, biz, category, fav, onOpen, onToggleFav }) {
  const discount = Math.round(100 - (offer.new_price_cents / offer.old_price_cents) * 100);
  return (
    <div className="card flex-shrink-0" style={{ minWidth: 210, maxWidth: 210 }}>
      <div className="flex items-center justify-center text-3xl relative rounded-t-2xl" style={{ background: "#EDE7DA", height: 90 }}>
        {category?.emoji || "🏪"}
        {discount > 0 && <span className="absolute top-2 left-2 bg-accent text-white text-[11px] font-bold rounded-md px-1.5 py-0.5">-{discount}%</span>}
        <span onClick={() => onToggleFav(offer.id)} className={`absolute top-2 right-2 bg-white/95 rounded-full p-1.5 flex ${fav ? "text-accent" : "text-inksoft"}`}>
          <Icon name="heart" size={14} filled={fav} />
        </span>
      </div>
      <div className="p-3">
        <p className="text-sm font-semibold leading-tight" style={{ minHeight: 34 }}>{offer.title}</p>
        <p className="text-xs text-inksoft">{biz?.name}</p>
        <div className="flex items-baseline gap-2 mt-1">
          <span className="text-xs line-through text-inksoft">R$ {(offer.old_price_cents / 100).toFixed(2)}</span>
          <span className="text-base font-bold text-accent">R$ {(offer.new_price_cents / 100).toFixed(2)}</span>
        </div>
        <button onClick={() => onOpen(offer.business_id)} className="btn-primary w-full text-sm py-2 mt-2">Ver oferta</button>
      </div>
    </div>
  );
}

function EventCard({ ev, onWhatsapp }) {
  return (
    <div className="card p-3.5">
      <p className="text-sm font-semibold">{ev.title}</p>
      <p className="text-xs mt-1.5 text-inksoft flex items-center gap-1.5 flex-wrap">
        <Icon name="calendar" size={13} /> {ev.event_date} {ev.event_time ? "· " + ev.event_time : ""} · {ev.location}
      </p>
      {ev.description && <p className="text-xs mt-1.5 text-ink/80">{ev.description}</p>}
      <div className="flex gap-2 mt-3">
        <button onClick={() => onWhatsapp(ev.whatsapp, `Olá! Vi o evento "${ev.title}" no DivulgaAqui.`)} className="btn-primary text-xs px-3 py-2 flex items-center gap-1.5">
          <Icon name="message" size={14} /> Falar no WhatsApp
        </button>
      </div>
    </div>
  );
}

// =========================================================
// APP PRINCIPAL
// =========================================================
function App() {
  const [tab, setTab] = useState("home");
  const [query, setQuery] = useState("");
  const [activeCat, setActiveCat] = useState(null);
  const [categories, setCategories] = useState([]);
  const [businesses, setBusinesses] = useState([]);
  const [offers, setOffers] = useState([]);
  const [events, setEvents] = useState([]);
  const [reviews, setReviews] = useState([]);
  const [loading, setLoading] = useState(true);
  const [openBizId, setOpenBizId] = useState(null);
  const [favs, setFavs] = useState({ business: new Set(), offer: new Set() });
  const [showRegister, setShowRegister] = useState(false);
  const [registerDone, setRegisterDone] = useState(false);
  const [registerError, setRegisterError] = useState(null);

  useEffect(() => {
    async function load() {
      if (!db) { setLoading(false); return; }
      const [{ data: cats }, { data: bizs }, { data: offs }, { data: evs }, { data: revs }] = await Promise.all([
        db.from("categories").select("*").order("sort_order"),
        db.from("businesses").select("*").eq("approved", true).eq("status", "approved"),
        db.from("offers").select("*").eq("approved", true).eq("active", true),
        db.from("events").select("*").eq("approved", true),
        db.from("reviews").select("*")
      ]);
      setCategories(cats || []);
      setBusinesses(bizs || []);
      setOffers(offs || []);
      setEvents(evs || []);
      setReviews(revs || []);
      setLoading(false);
    }
    load();
  }, []);

  const categoryById = (id) => categories.find((c) => c.id === id);
  const businessById = (id) => businesses.find((b) => b.id === id);

  const toggleFav = (kind, id) => {
    setFavs((prev) => {
      const next = { ...prev, [kind]: new Set(prev[kind]) };
      next[kind].has(id) ? next[kind].delete(id) : next[kind].add(id);
      return next;
    });
  };

  const openWhatsapp = (whatsapp, message) =>
    window.open(`https://wa.me/${whatsapp}?text=${encodeURIComponent(message)}`, "_blank");

  const filteredBusinesses = useMemo(() => {
    const q = query.trim().toLowerCase();
    return businesses.filter((b) => {
      const matchesCat = activeCat ? b.category_id === activeCat : true;
      const matchesQ = q ? (b.name || "").toLowerCase().includes(q) || (b.description || "").toLowerCase().includes(q) : true;
      return matchesCat && matchesQ;
    });
  }, [businesses, query, activeCat]);

  const Header = () => (
    <div className="px-4 pt-6 pb-4 text-primaryink rounded-b-[24px]" style={{ background: "linear-gradient(160deg, #163B35 0%, #0E2A25 100%)" }}>
      <div className="inline-flex items-center gap-1.5 text-[11px] font-medium px-2.5 py-1 rounded-full mb-2.5" style={{ background: "rgba(243,247,245,0.12)" }}>
        <Icon name="pin" size={12} /> São Pedro do Piauí · PI
      </div>
      <p className="text-[26px] leading-none font-display font-semibold">DivulgaAqui</p>
      <p className="text-[13px] opacity-75 mt-1.5">Tudo que acontece na sua cidade, em um só lugar.</p>
      <div className="input flex items-center gap-2 px-3 py-2.5 mt-4">
        <Icon name="search" size={17} className="text-inksoft flex-shrink-0" />
        <input
          value={query}
          onChange={(e) => { setQuery(e.target.value); setTab("explore"); }}
          placeholder="Busque empresas, serviços, promoções..."
          className="flex-1 text-sm bg-transparent outline-none text-ink placeholder:text-inksoft"
        />
      </div>
    </div>
  );

  const HomeView = () => (
    <div className="pb-4">
      <Header />
      {offers.length > 0 && (
        <div className="px-4 mt-5">
          <p className="text-sm font-semibold mb-2.5 text-ink flex items-center gap-1.5"><Icon name="flame" size={15} className="text-accent" /> Ofertas de hoje</p>
          <div className="scrollx">
            {offers.slice(0, 6).map((o) => (
              <OfferCard key={o.id} offer={o} biz={businessById(o.business_id)} category={categoryById(businessById(o.business_id)?.category_id)}
                fav={favs.offer.has(o.id)} onOpen={setOpenBizId} onToggleFav={(id) => toggleFav("offer", id)} />
            ))}
          </div>
        </div>
      )}

      <div className="px-4 mt-6">
        <div className="flex items-center justify-between mb-2.5">
          <p className="text-sm font-semibold text-ink">Categorias</p>
          <button onClick={() => { setActiveCat(null); setTab("explore"); }} className="text-xs font-semibold text-primary">Ver todas</button>
        </div>
        <div className="grid grid-cols-4 gap-3">
          {categories.map((c) => (
            <button key={c.id} onClick={() => { setActiveCat(c.id); setTab("explore"); }} className="flex flex-col items-center gap-1.5">
              <div className="flex items-center justify-center rounded-2xl text-2xl" style={{ background: "#EFE9DC", width: 52, height: 52 }}>{c.emoji}</div>
              <span className="text-[11px] text-center leading-tight text-inksoft">{c.name}</span>
            </button>
          ))}
        </div>
      </div>

      <div className="px-4 mt-7">
        <p className="text-sm font-semibold mb-2.5 text-ink">Empresas em destaque</p>
        <div className="flex flex-col gap-2">
          {businesses.slice(0, 6).map((b) => (
            <BusinessCard key={b.id} biz={b} category={categoryById(b.category_id)} fav={favs.business.has(b.id)} onOpen={setOpenBizId} onToggleFav={(id) => toggleFav("business", id)} />
          ))}
          {businesses.length === 0 && !loading && (
            <div className="card p-6 text-center">
              <p className="text-sm font-medium">Nenhuma empresa cadastrada ainda</p>
              <p className="text-xs text-inksoft mt-1">Seja o primeiro negócio de São Pedro do Piauí no DivulgaAqui.</p>
              <button onClick={() => setShowRegister(true)} className="btn-primary text-xs px-4 py-2 mt-3 inline-flex items-center gap-1.5"><Icon name="plus" size={13} /> Cadastrar empresa</button>
            </div>
          )}
        </div>
      </div>

      {events.length > 0 && (
        <div className="px-4 mt-7">
          <p className="text-sm font-semibold mb-2.5 text-ink">Próximos eventos</p>
          <div className="flex flex-col gap-2">
            {events.slice(0, 2).map((ev) => <EventCard key={ev.id} ev={ev} onWhatsapp={openWhatsapp} />)}
          </div>
        </div>
      )}
    </div>
  );

  const ExploreView = () => (
    <div className="pb-4">
      <Header />
      <div className="px-4 mt-4">
        <div className="scrollx mb-3">
          <button onClick={() => setActiveCat(null)} className={`chip text-xs px-3 py-1.5 whitespace-nowrap ${!activeCat ? "active" : ""}`}>Todas</button>
          {categories.map((c) => (
            <button key={c.id} onClick={() => setActiveCat(c.id)} className={`chip text-xs px-3 py-1.5 whitespace-nowrap ${activeCat === c.id ? "active" : ""}`}>{c.emoji} {c.name}</button>
          ))}
        </div>
        <p className="text-xs mb-2.5 text-inksoft">{filteredBusinesses.length} resultado{filteredBusinesses.length === 1 ? "" : "s"}</p>
        <div className="flex flex-col gap-2">
          {filteredBusinesses.map((b) => (
            <BusinessCard key={b.id} biz={b} category={categoryById(b.category_id)} fav={favs.business.has(b.id)} onOpen={setOpenBizId} onToggleFav={(id) => toggleFav("business", id)} />
          ))}
          {filteredBusinesses.length === 0 && (
            <div className="card p-6 text-center">
              <p className="text-sm font-medium">Nenhum resultado</p>
              <p className="text-xs text-inksoft mt-1">Tente outro termo de busca ou categoria.</p>
            </div>
          )}
        </div>
      </div>
    </div>
  );

  const OffersView = () => (
    <div className="pb-4">
      <div className="px-4 pt-6 pb-3">
        <p className="text-xl font-display font-semibold">Ofertas</p>
        <p className="text-xs text-inksoft mt-0.5">Promoções ativas das empresas da cidade</p>
      </div>
      <div className="px-4 grid grid-cols-2 gap-3">
        {offers.map((o) => (
          <OfferCard key={o.id} offer={o} biz={businessById(o.business_id)} category={categoryById(businessById(o.business_id)?.category_id)}
            fav={favs.offer.has(o.id)} onOpen={setOpenBizId} onToggleFav={(id) => toggleFav("offer", id)} />
        ))}
        {offers.length === 0 && <p className="text-sm text-inksoft col-span-2 text-center py-8">Nenhuma oferta ativa no momento. Volte em breve.</p>}
      </div>
    </div>
  );

  const EventsView = () => (
    <div className="pb-4">
      <div className="px-4 pt-6 pb-3">
        <p className="text-xl font-display font-semibold">Eventos</p>
        <p className="text-xs text-inksoft mt-0.5">O que vai rolar na cidade</p>
      </div>
      <div className="px-4 flex flex-col gap-2">
        {events.map((ev) => <EventCard key={ev.id} ev={ev} onWhatsapp={openWhatsapp} />)}
        {events.length === 0 && <p className="text-sm text-inksoft text-center py-8">Nenhum evento cadastrado no momento.</p>}
      </div>
    </div>
  );

  const ProfileView = () => (
    <div className="pb-4">
      <div className="px-4 pt-6 pb-3">
        <p className="text-xl font-display font-semibold">Perfil</p>
        <p className="text-xs text-inksoft mt-0.5 flex items-center gap-1"><Icon name="pin" size={12} /> Visitante · São Pedro do Piauí</p>
      </div>
      <div className="px-4 mt-2">
        <button onClick={() => setShowRegister(true)} className="btn-accent w-full py-3.5 text-sm flex items-center justify-center gap-2">
          <Icon name="plus" size={16} /> Divulgue seu negócio
        </button>
      </div>
      <div className="px-4 mt-6">
        <p className="text-sm font-semibold mb-2 text-ink flex items-center gap-1.5"><Icon name="heart" size={14} /> Favoritos</p>
        <div className="card p-3.5 text-xs text-inksoft">
          {favs.business.size} empresa(s) e {favs.offer.size} oferta(s) favoritadas nesta sessão.
        </div>
      </div>
    </div>
  );

  // -------- Detalhe da empresa --------
  const BizDetail = () => {
    const biz = businessById(openBizId);
    if (!biz) return null;
    const category = categoryById(biz.category_id);
    const bizOffers = offers.filter((o) => o.business_id === biz.id);
    const bizReviews = reviews.filter((r) => r.business_id === biz.id);
    return (
      <div className="fixed inset-0 bg-bg overflow-y-auto z-30">
        <div className="flex items-center justify-center text-5xl relative" style={{ background: "#EFE9DC", height: 150 }}>
          {category?.emoji || "🏪"}
          <button onClick={() => setOpenBizId(null)} className="absolute top-4 left-4 bg-white/95 rounded-full p-2 shadow-sm text-ink">
            <Icon name="chevronLeft" size={19} strokeWidth={2.2} />
          </button>
        </div>
        <div className="px-4 pt-4 pb-8">
          <p className="text-lg font-display font-semibold flex items-center gap-1.5">
            {biz.name}
            {biz.verified && <Icon name="check" size={15} strokeWidth={2.5} className="text-primary" title="Verificada" />}
          </p>
          <p className="text-xs mt-1 text-inksoft">{category?.name} · {biz.opening_hours}</p>
          {biz.description && <p className="text-sm mt-3 leading-relaxed">{biz.description}</p>}
          {biz.address && <p className="text-xs mt-2 text-inksoft flex items-center gap-1.5"><Icon name="pin" size={12} /> {biz.address}</p>}
          <div className="grid grid-cols-2 gap-2 mt-4">
            <button onClick={() => openWhatsapp(biz.whatsapp, "Olá! Vi sua oferta no DivulgaAqui e gostaria de saber mais.")} className="btn-primary py-2.5 text-sm flex items-center justify-center gap-1.5"><Icon name="message" size={15} /> WhatsApp</button>
            <a href={`tel:${(biz.phone || "").replace(/\D/g, "")}`} className="btn-ghost py-2.5 text-sm text-center flex items-center justify-center gap-1.5"><Icon name="phone" size={15} /> Ligar</a>
            <a href={`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(biz.address || "")}`} target="_blank" className="btn-ghost py-2.5 text-sm text-center flex items-center justify-center gap-1.5"><Icon name="map" size={15} /> Como chegar</a>
            <button onClick={() => navigator.share && navigator.share({ title: "DivulgaAqui", text: `Olha essa empresa: ${biz.name}!` })} className="btn-ghost py-2.5 text-sm flex items-center justify-center gap-1.5"><Icon name="share" size={15} /> Compartilhar</button>
          </div>
          {bizOffers.length > 0 && (
            <div className="mt-6">
              <p className="text-sm font-semibold mb-2 flex items-center gap-1.5"><Icon name="flame" size={14} className="text-accent" /> Ofertas</p>
              <div className="scrollx">
                {bizOffers.map((o) => <OfferCard key={o.id} offer={o} biz={biz} category={category} fav={favs.offer.has(o.id)} onOpen={() => {}} onToggleFav={(id) => toggleFav("offer", id)} />)}
              </div>
            </div>
          )}
          <div className="mt-6">
            <p className="text-sm font-semibold mb-2">Avaliações</p>
            {bizReviews.length === 0 && <p className="text-xs text-inksoft">Ainda sem avaliações.</p>}
            {bizReviews.map((r) => (
              <div key={r.id} className="card p-3 mt-2">
                <div className="flex items-center justify-between"><p className="text-sm font-semibold">{r.user_id || "Cliente"}</p><Stars value={r.rating} /></div>
                <p className="text-xs mt-1 text-inksoft">{r.comment}</p>
              </div>
            ))}
          </div>
        </div>
      </div>
    );
  };

  // -------- Cadastro de negócio --------
  const RegisterSheet = () => {
    const [values, setValues] = useState({});
    const [categoryId, setCategoryId] = useState(categories[0]?.id || "");

    const submit = async (e) => {
      e.preventDefault();
      setRegisterError(null);
      try {
        const { data: city } = await db.from("cities").select("id").eq("slug", CITY_SLUG).single();
        if (!city) throw new Error("Cidade não encontrada no banco.");
        const { error } = await db.from("businesses").insert({
          city_id: city.id,
          category_id: categoryId,
          name: values.name || "",
          slug: slugify(values.name || "empresa") + "-" + Date.now(),
          description: values.description || "",
          phone: values.phone || "",
          whatsapp: (values.whatsapp || "").replace(/\D/g, ""),
          address: values.address || "",
          neighborhood: values.neighborhood || "",
          opening_hours: values.hours || "",
          status: "pending",
          approved: false
        });
        if (error) throw error;
        setRegisterDone(true);
      } catch (err) {
        setRegisterError(err.message || "Não foi possível enviar. Tente de novo.");
      }
    };

    return (
      <div className="fixed inset-0 bg-bg overflow-y-auto z-30">
        <div className="px-4 pt-5 flex items-center gap-2.5">
          <button onClick={() => { setShowRegister(false); setRegisterDone(false); }} className="p-1 -ml-1 text-ink">
            <Icon name="chevronLeft" size={20} strokeWidth={2.2} />
          </button>
          <p className="text-lg font-display font-semibold">Divulgue seu negócio</p>
        </div>
        {!registerDone ? (
          <form onSubmit={submit} className="px-4 mt-5 flex flex-col gap-3.5 pb-10">
            <label className="text-xs font-semibold text-inksoft">Nome da empresa
              <input required className="input w-full text-sm px-3 py-2.5 mt-1.5" value={values.name || ""} onChange={(e) => setValues((v) => ({ ...v, name: e.target.value }))} />
            </label>
            <label className="text-xs font-semibold text-inksoft">Categoria
              <select className="input w-full text-sm px-3 py-2.5 mt-1.5" value={categoryId} onChange={(e) => setCategoryId(e.target.value)}>
                {categories.map((c) => <option key={c.id} value={c.id}>{c.emoji} {c.name}</option>)}
              </select>
            </label>
            {[["description", "Descrição"], ["phone", "Telefone"], ["whatsapp", "WhatsApp"], ["address", "Endereço"], ["neighborhood", "Bairro"], ["hours", "Horário de funcionamento"]].map(([name, label]) => (
              <label key={name} className="text-xs font-semibold text-inksoft">{label}
                <input className="input w-full text-sm px-3 py-2.5 mt-1.5" value={values[name] || ""} onChange={(e) => setValues((v) => ({ ...v, [name]: e.target.value }))} />
              </label>
            ))}
            {registerError && <p className="text-xs text-accent">{registerError}</p>}
            <button type="submit" className="btn-accent w-full py-3.5 text-sm mt-2">Enviar cadastro</button>
            <p className="text-xs text-center pb-6 text-inksoft">Sua empresa entra em análise antes de aparecer no app.</p>
          </form>
        ) : (
          <div className="px-4 mt-10 text-center">
            <div className="inline-flex items-center justify-center rounded-full mx-auto text-primary" style={{ background: "#E7F0EC", width: 64, height: 64 }}>
              <Icon name="check" size={28} strokeWidth={2.5} />
            </div>
            <p className="text-base font-display font-semibold mt-4">Cadastro enviado</p>
            <p className="text-sm mt-1.5 text-inksoft max-w-[280px] mx-auto">Sua empresa entrará em análise e aparecerá no DivulgaAqui em breve.</p>
            <button onClick={() => { setShowRegister(false); setRegisterDone(false); }} className="btn-primary px-6 py-2.5 text-sm mt-5">Voltar ao início</button>
          </div>
        )}
      </div>
    );
  };

  const NAV = [
    { id: "home", label: "Início", icon: "home" },
    { id: "explore", label: "Explorar", icon: "compass" },
    { id: "offers", label: "Ofertas", icon: "flame" },
    { id: "events", label: "Eventos", icon: "calendar" },
    { id: "profile", label: "Perfil", icon: "user" }
  ];

  return (
    <div style={{ maxWidth: 430, margin: "0 auto", minHeight: "100vh", paddingBottom: 82, position: "relative" }}>
      {loading && (
        <div className="px-4 pt-6">
          <div className="skel" style={{ height: 148, borderRadius: 24 }} />
          <div className="skel mt-5" style={{ height: 14, width: "40%" }} />
          <div className="flex gap-3 mt-3">
            {[0, 1, 2, 3].map((i) => <div key={i} className="skel" style={{ width: 52, height: 52, borderRadius: 16 }} />)}
          </div>
          <div className="skel mt-6" style={{ height: 14, width: "50%" }} />
          <div className="flex flex-col gap-2 mt-3">
            {[0, 1, 2].map((i) => <div key={i} className="skel" style={{ height: 72 }} />)}
          </div>
        </div>
      )}
      {!loading && tab === "home" && <HomeView />}
      {!loading && tab === "explore" && <ExploreView />}
      {!loading && tab === "offers" && <OffersView />}
      {!loading && tab === "events" && <EventsView />}
      {!loading && tab === "profile" && <ProfileView />}
      {openBizId && <BizDetail />}
      {showRegister && <RegisterSheet />}
      <nav className="fixed bottom-0 left-0 right-0 bg-surface border-t flex justify-around py-2 px-2 z-20" style={{ borderColor: "#EFE9DC", maxWidth: 430, margin: "0 auto", boxShadow: "0 -2px 8px rgba(28,27,25,0.04)" }}>
        {NAV.map(({ id, label, icon }) => {
          const active = tab === id;
          return (
            <button key={id} onClick={() => { setTab(id); setOpenBizId(null); setShowRegister(false); }}
              className="flex flex-col items-center gap-1 text-[10.5px] font-medium px-3 py-1.5 rounded-xl"
              style={{ color: active ? "#163B35" : "#6B6459", background: active ? "#EEF3F1" : "transparent" }}>
              <Icon name={icon} size={19} strokeWidth={active ? 2.1 : 1.8} />
              {label}
            </button>
          );
        })}
      </nav>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
